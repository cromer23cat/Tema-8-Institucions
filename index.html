<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema 8: Institucions</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f7f9; }
        .card { text-align: center; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 450px; }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; margin-bottom: 30px; }
        .btn { display: block; padding: 15px; margin: 15px 0; text-decoration: none; color: white; border-radius: 12px; font-weight: bold; font-size: 1.1rem; transition: all 0.3s ease; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .normal { background: linear-gradient(135deg, #34a853, #2d9147); }
        .expert { background: linear-gradient(135deg, #ea4335, #c5392d); }
        .footer { font-size: 0.8rem; color: #bdc3c7; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🏛️ Tema 8: Institucions</h1>
        <p>Selecciona el nivell del qüestionari:</p>
        
        <a href="./Questionari%20Normal/" class="btn normal">📘 Nivell Normal</a>
        <a href="./Questionari%20Expert/" class="btn expert">🚀 Nivell Expert</a>
        
        <div class="footer">Geografia e Història - cromer23cat</div>
    </div>
</body>
</html>
